<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e172e"/>
      <stop offset="50%" stop-color="#070b19"/>
      <stop offset="100%" stop-color="#030610"/>
    </linearGradient>

    <!-- Border Ring Gradient -->
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Primary Accent Cyan-Blue Gradient -->
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Right Facet Blue-Purple Gradient -->
    <linearGradient id="bluePurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Crossbar Glowing Gradient -->
    <linearGradient id="crossbarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Outer Shell -->
  <rect x="20" y="20" width="472" height="472" rx="128" fill="url(#bg)" stroke="url(#border)" stroke-width="14"/>
  
  <!-- Subtle Internal Ambient Radial Glow -->
  <circle cx="256" cy="220" r="140" fill="#00f0ff" opacity="0.08"/>

  <!-- Left Stem of 'A' (Faceted Cyan-Blue) -->
  <path d="M256 96 L120 396 L188 396 L256 242 Z" fill="url(#cyanBlue)" filter="url(#softGlow)"/>

  <!-- Right Stem of 'A' (Faceted Blue-Purple) -->
  <path d="M256 96 L256 242 L324 396 L392 396 Z" fill="url(#bluePurple)"/>

  <!-- Futuristic Floating Crossbar / Code Chevron Dash -->
  <path d="M174 316 L338 316" stroke="url(#crossbarGrad)" stroke-width="26" stroke-linecap="round"/>

  <!-- Top Apex Tech Gem -->
  <circle cx="256" cy="98" r="14" fill="#00f0ff"/>
  <circle cx="256" cy="98" r="7" fill="#ffffff"/>
</svg>